<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Get Schooled</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="works_on_smartphone">
  <div class="page">

    <header>
      <div class="header-container">
        <div class="logo">
          <img src="logo.png" alt="Logo">
        </div>
        <nav>
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Sign Up</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <section class="banner">
      <div class="overlay">
        <div class="get-schooled">Get schooled</div>
        <div class="smile">SMILE</div>
        <div class="grin">GRIN</div>
        <div class="laugh">LAUGH</div>
        <div class="learn-pros">
          <span class="learn-word">Learn</span> <span class="from-pros">from the pros</span>
        </div>
        <button class="register">Register for free</button>
      </div>

      <!-- Image row -->
      <div class="image-row">
        <div class="image-item">
          <img src="1.png" alt="Phillip Massey">
          <div class="image-name">Phillip Massey</div>
          <div class="image-desc">« Smile of the year » 2018 - 2019</div>
        </div>
        <div class="image-item">
          <img src="3.png" alt="Nannie Lawrence">
          <div class="image-name">Nannie Lawrence</div>
          <div class="image-desc">Best « little smile » 2017</div>
        </div>
        <div class="image-item">
          <img src="2.png" alt="Bruce Walters" class="rounded">
          <div class="image-name">Bruce Walters</div>
          <div class="image-desc">Best « Friend Smile » live performance 2019</div>
        </div>
        <div class="image-item">
          <img src="4.png" alt="Henry Hughes">
          <div class="image-name">Henry Hughes</div>
          <div class="image-desc">« 24h smiles » winner 2016 - 2019</div>
        </div>
      </div>

    </section>

  </div>
</body>
</html>
