<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="4-styles.css" />
</head>
<body>
  <section class="social-page">
    <div class="social-left">
      <img src="images/logo_headphones.png" alt="Logo" class="logo" />
    </div>

    <div class="social-right">
      <img src="images/facebook.png" alt="Facebook" class="icon" />
      <img src="images/twitter.png" alt="Twitter" class="icon" />
      <img src="images/instagram.png" alt="Instagram" class="icon" />
    </div>

    <div class="social-bottom">
      <p>©headphones 2020</p>
    </div>
  </section>
</body>
</html>
